[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newspaper-explorer"
version = "0.2.0"
description = "A tool for exploring and analyzing newspaper content"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "newspaper-collective" }]
keywords = ["newspaper", "explorer", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "polars>=0.20.0",
    "lxml>=5.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "natsort>=8.4.0",
    "Pillow>=10.0.0",
    "ultralytics>=8.0.0",
    "spacy>=3.7.0",
    "germalemma>=0.1.3",
    "unidecode>=1.3.0",
    "pyphen>=0.14.0",
    "transformers>=4.30.0",
    "torch>=1.12.0",
    "gliner>=0.1.0",
    "bertopic>=0.15.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "gensim>=4.3.0",
    "rake-nltk>=1.0.6",
    "yake>=0.4.8",
    "keybert>=0.8.0",
    "plotly>=5.17.0",
    "pandas>=2.0.0",
    "neo4j>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests>=2.32.0",
    "types-tqdm>=4.67.0",
    "lxml-stubs",
]
streamlit = ["streamlit>=1.28.0"]


[project.scripts]
newspaper-explorer = "newspaper_explorer.main:cli"

[project.urls]
Homepage = "https://github.com/newspaper-collective/newspaper_explorer"
Repository = "https://github.com/newspaper-collective/newspaper_explorer"
Issues = "https://github.com/newspaper-collective/newspaper_explorer/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newspaper_explorer = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except (no bare except:)
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "T20",   # flake8-print (no print statements)
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
    "Q",     # flake8-quotes
    "RUF",   # Ruff-specific rules
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented-out code)
    "PL",    # pylint (includes PLR1702: too-many-nested-blocks)
    "PERF",  # perflint (performance)
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "FBT",   # flake8-boolean-trap (no boolean positional args)
    "RET",   # flake8-return
    "TCH",   # flake8-type-checking
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PERF203", # try-except in loop (sometimes necessary)
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
]

# Complexity limits (anti-LLM-slop)
[tool.ruff.lint.mccabe]
max-complexity = 15 # Maximum cyclomatic complexity

[tool.ruff.lint.pylint]
max-nested-blocks = 3 # Maximum nested block depth (PLR1702)
max-branches = 15 # Maximum number of branches (PLR0912)
max-statements = 75 # Maximum number of statements (PLR0915)

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # Allow unused imports in __init__.py
]
"tests/**/*.py" = [
    "S101",    # Allow assert in tests
    "PLR2004", # Allow magic values in tests
    "ANN",     # Don't require annotations in tests
    "FBT",     # Allow boolean args in tests
]

[tool.ruff.lint.isort]
known-first-party = ["newspaper_explorer"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require actual data files)",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=newspaper_explorer",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
filterwarnings = [
    # Ignore deprecation warnings from spacy/weasel about Click 9.0
    "ignore:Importing 'parser.split_arg_string':DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "newspaper_explorer.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "pyphen",
    "germalemma",
    "germalemma.germalemma",
    "germalemma.GermanLemma",
    "cv2",
    "gliner",
    "gliner2",
    "gensim",
    "gensim.models",
    "gensim.corpora",
    "gensim.parsing.preprocessing",
    "keybert",
    "yake",
    "rake_nltk",
    "bertopic",
    "sklearn",
    "sklearn.feature_extraction.text",
]
ignore_missing_imports = true
